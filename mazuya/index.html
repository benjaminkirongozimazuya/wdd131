<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazuya | Accueil</title>
    
    <meta name="description" content="Mazuya - Plateforme de partage de vidéos courtes">
    <meta name="author" content="Benjamin Kirongozi Mazuya">
    <meta name="theme-color" content="#ff0050">

    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Fichier CSS principal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- En-tête -->
    <header class="header">
        <h1>Mazuya</h1>
        <p>Fil d'actualité</p>
    </header>

    <!-- Conteneur principal du fil de vidéos -->
    <main id="feed">
        <!-- Les vidéos seront chargées dynamiquement par JS -->
    </main>

    <!-- Barre de navigation inférieure -->
    <nav class="bottom-nav">
        <button type="button" class="active" onclick="location.href='index.html'" aria-label="Accueil">🏠</button>
        <button type="button" onclick="location.href='upload.html'" aria-label="Publier">➕</button>
        <button type="button" onclick="location.href='profile.html'" aria-label="Profil">👤</button>
    </nav>

    <!-- Scripts JavaScript -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/script.js"></script>

    <!-- Enregistrement du Service Worker PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js")
          .then(() => console.log("Service Worker Mazuya Enregistré !"))
          .catch((err) => console.log("Erreur Service Worker :", err));
      }
    </script>
</body>
</html>
