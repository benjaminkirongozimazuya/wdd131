<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazuya | Accueil</title>
    
    <meta name="description" content="Mazuya - Plateforme de partage de vidéos courtes">
    <meta name="author" content="Benjamin Kirongozi Mazuya">
    <meta name="theme-color" content="#ff0050">

    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Fichier CSS principal -->
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <!-- En-tête -->
    <header class="header">
        <h1>Mazuya</h1>
        <p>Fil d'actualité</p>
    </header>

<!-- Conteneur principal du fil de vidéos -->
<main id="feed">
    <!-- Les vidéos chargées dynamiquement ou en dur -->
    <div class="video-container" data-video-id="video1">
        <video src="votre-video.mp4" loop playsinline></video>

        <!-- Boutons d'actions -->
        <div class="actions">
            <!-- Bouton Like -->
            <button class="like-btn" onclick="toggleLike('video1')">
                <span class="like-icon">❤️</span>
                <span class="like-count" id="like-count-video1">0</span>
            </button>

            <!-- Bouton Commentaire -->
            <button class="comment-btn" onclick="openComments('video1')">
                <span class="comment-icon">💬</span>
                <span class="comment-count" id="comment-count-video1">0</span>
            </button>
        </div>
    </div>
</main> <!-- /main fermé ici -->

<!-- Modale de Commentaires (Placée EN DEHORS du feed) -->
<div id="comment-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Commentaires</h3>
            <button class="close-btn" onclick="closeComments()">&times;</button>
        </div>
        
        <!-- Liste des commentaires -->
        <div id="comments-list" class="comments-list"></div>

        <!-- Formulaire d'envoi -->
        <form id="comment-form" onsubmit="addComment(event)">
            <input type="text" id="comment-input" placeholder="Ajouter un commentaire..." required autocomplete="off">
            <button type="submit">Envoyer</button>
        </form>
    </div>
</div>
    <!-- Barre de navigation inférieure -->
    <nav class="bottom-nav">
        <button type="button" class="active" onclick="location.href='index.html'" aria-label="Accueil">🏠</button>
        <button type="button" onclick="location.href='upload.html'" aria-label="Publier">➕</button>
        <button type="button" onclick="location.href='profile.html'" aria-label="Profil">👤</button>
    </nav>

    <!-- Scripts JavaScript -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/script.js"></script>

    <!-- Enregistrement du Service Worker PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js")
          .then(() => console.log("Service Worker Mazuya Enregistré !"))
          .catch((err) => console.log("Erreur Service Worker :", err));
      }
    </script>
</body>
</html>
