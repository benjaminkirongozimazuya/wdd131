<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazuya | Publier une vidéo</title>
    
    <meta name="description" content="Publiez une nouvelle vidéo sur la plateforme Mazuya.">
    <meta name="author" content="Benjamin Kirongozi Mazuya">
    <meta name="theme-color" content="#ff0050">

    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap](https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap)" rel="stylesheet">

    <!-- LIEN CSS CORRIGÉ (Dossier css/) -->
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <header class="header">
        <h1>Mazuya</h1>
        <p>Publier une nouvelle vidéo</p>
    </header>

    <main class="upload-page">
        <form id="uploadForm" class="upload-form">
            
            <div class="preview">
                <video id="previewVideo" controls muted playsinline></video>
            </div>

            <label class="upload-label">
                Sélectionner une vidéo
                <input type="file" id="videoFile" accept="video/mp4,video/webm,video/ogg" required>
            </label>

            <input type="text" id="username" placeholder="Nom d'utilisateur" maxlength="30" required>
            <textarea id="description" placeholder="Décrivez votre vidéo..." maxlength="200" rows="4" required></textarea>

            <button type="submit" class="publish-btn">Publier</button>
            <p id="status"></p>

        </form>
    </main>

    <nav class="bottom-nav">
        <button type="button" onclick="location.href='index.html'" aria-label="Accueil">🏠</button>
        <button type="button" class="active" onclick="location.href='upload.html'" aria-label="Publier">➕</button>
        <button type="button" onclick="location.href='profile.html'" aria-label="Profil">👤</button>
    </nav>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/upload.js"></script>
</body>
</html>
