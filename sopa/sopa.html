<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lushoi Vibe Promotion</title>
  <style>
    /* Style du bouton TikTok */
    .btn-tiktok {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: #000000;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-family: sans-serif;
      transition: background-color 0.3s ease;
    }
    .btn-tiktok:hover {
      background-color: #25F4EE;
      color: #000000;
    }
    .tiktok-card {
      margin: 20px 0;
      max-width: 325px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lushoi Vibe Promotion</h1>
  </header>

  <main>
    <!-- Section Authentification TikTok -->
    <section id="auth-section">
      <h2>Connexion Artiste / Utilisateur</h2>
      <a id="tiktok-login-btn" href="#" class="btn-tiktok">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 1 1-2.896-2.896c.244 0 .482.03.71.087V9.382a6.34 6.34 0 0 0-.71-.04 6.341 6.341 0 1 0 6.341 6.341V8.847a8.212 8.212 0 0 0 4.77 1.523v-3.6a4.83 4.83 0 0 1-1.000-.084z"/>
        </svg>
        Se connecter avec TikTok
      </a>
      <div id="user-status" style="margin-top: 15px;"></div>
    </section>

    <hr>

    <!-- Section Intégration des Vidéos des Artistes -->
    <section id="videos-section">
      <h2>Vidéos à la Une</h2>
      <div class="tiktok-card">
        <!-- Remplacez cite et data-video-id par l'URL et l'ID de la vidéo de votre artiste -->
        <blockquote class="tiktok-embed" 
                    cite="https://www.tiktok.com/@tiktok/video/7106594312291126574" 
                    data-video-id="7106594312291126574" 
                    style="max-width: 605px; min-width: 325px;">
          <section></section>
        </blockquote>
      </div>
    </section>
  </main>

  <!-- Scripts TikTok & Logiciel -->
  <script async src="https://www.tiktok.com/embed.js"></script>
  <script src="sopa.js"></script>
</body>
</html>
