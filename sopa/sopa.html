<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lushoi Vibe Promotion</title>
  <link rel="stylesheet" href="sopa.css">
</head>
<body>

  <!-- En-tête / Header -->
  <header class="main-header">
    <div class="header-container">
      <h1 class="logo">Lushoi <span>Vibe</span></h1>
      <p class="subtitle">Promotion des Talents Musique du Katanga</p>
    </div>
  </header>

  <main class="container">
    <!-- Section Authentification TikTok -->
    <section class="card auth-card">
      <h2>Espace Artiste & Membres</h2>
      <p class="auth-desc">Connectez votre compte TikTok pour gérer votre profil et afficher vos contenus.</p>
      
      <a id="tiktok-login-btn" href="#" class="btn-tiktok">
        <svg class="tiktok-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 1 1-2.896-2.896c.244 0 .482.03.71.087V9.382a6.34 6.34 0 0 0-.71-.04 6.341 6.341 0 1 0 6.341 6.341V8.847a8.212 8.212 0 0 0 4.77 1.523v-3.6a4.83 4.83 0 0 1-1.000-.084z"/>
        </svg>
        <span>Se connecter avec TikTok</span>
      </a>

      <div id="user-status" class="status-box"></div>
    </section>

    <!-- Section Vidéos à la Une -->
    <section class="card showcase-card">
      <h2>Vidéos à la Une</h2>
      <p class="section-desc">Découvrez les derniers extraits tendance des artistes Katangais.</p>
      
      <div class="video-grid">
        <div class="video-wrapper">
          <!-- Remplacez le cite et le data-video-id par l'URL et l'ID TikTok d'un vrai artiste -->
          <blockquote class="tiktok-embed" 
                      cite="https://www.tiktok.com/@tiktok/video/7106594312291126574" 
                      data-video-id="7106594312291126574">
            <section></section>
          </blockquote>
        </div>
      </div>
    </section>
  </main>

  <!-- Script d'intégration TikTok -->
  <script async src="https://www.tiktok.com/embed.js"></script>
  <script src="sopa.js"></script>
</body>
</html>
